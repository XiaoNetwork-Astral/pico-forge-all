name: "publish-stable"
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["PicoForge CI"]
    branches:
      - release
    types:
      - completed

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # MacOS Builds:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"

          # Linux AppImage Builds (via container):
          - platform: "ubuntu-latest"
            appimage_variant: "glibc-2.28-x86_64"
            build_type: "appimage"
          - platform: "ubuntu-latest"
            appimage_variant: "musl-x86_64"
            build_type: "appimage"
          - platform: "ubuntu-24.04-arm"
            appimage_variant: "glibc-2.28-aarch64"
            build_type: "appimage"
          - platform: "ubuntu-24.04-arm"
            appimage_variant: "musl-aarch64"
            build_type: "appimage"

          # Linux Flatpak Builds:
          - platform: "ubuntu-latest"
            args: ""
            build_type: "flatpak"
          - platform: "ubuntu-24.04-arm"
            args: ""
            build_type: "flatpak"

          # Windows portable ZIPs and NSIS installers:
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            windows_arch: "x64"
            windows_target: "x86_64-pc-windows-msvc"
          - platform: "windows-latest"
            args: "--target i686-pc-windows-msvc"
            windows_arch: "x86"
            windows_target: "i686-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >
            ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' ||
            matrix.platform == 'windows-latest' && matrix.windows_target || '' }}

      - name: Cache Cargo registry and target
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Extract version from Cargo.toml
        id: get_version
        shell: bash
        run: |
          cargo_file="Cargo.toml"
          version=$(grep -m 1 '^version' "$cargo_file" | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          echo "Version found: $version"
          echo "version=$version" >> $GITHUB_ENV

      - name: Install cargo-packager
        if: runner.os != 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Build Binary
        if: runner.os != 'Linux'
        run: cargo build --release --locked ${{ matrix.args }}

      - name: Build and Package
        if: runner.os == 'macOS'
        run: cargo packager --release ${{ matrix.args }}

      - name: Set up Python for Windows packaging
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up MSVC for Windows tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.windows_arch }}

      - name: Package Windows releases with picotool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install cmake==3.31.10 ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'picotool-2.3.1'
          ./scripts/prepare_windows_picotool.ps1 -Arch '${{ matrix.windows_arch }}' -WorkDir $toolDirectory
          $runtime = @(Get-ChildItem -LiteralPath (Join-Path $env:VCToolsRedistDir '${{ matrix.windows_arch }}') -Directory -Filter 'Microsoft.VC*.CRT')
          if ($runtime.Count -ne 1) { throw 'Expected one VC runtime directory' }
          python scripts/package_windows_portable.py --picotool "$toolDirectory/tool/picotool.exe" --app 'target/${{ matrix.windows_target }}/release/picoforge.exe' --runtime-dir $runtime[0].FullName --output "target/release/pico-forge-all-v${env:version}-windows-${{ matrix.windows_arch }}.zip" --installer-output "target/release/pico-forge-all-v${env:version}-windows-${{ matrix.windows_arch }}-setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build AppImage
        if: matrix.build_type == 'appimage'
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/picoforge-appimage-builder:${{ matrix.appimage_variant }}"
          echo "Pulling container: ${IMAGE_NAME}"
          podman pull "${IMAGE_NAME}"
          mkdir -p target/release
          chmod +x .github/scripts/build_appimage.sh
          echo "Running build inside container..."
          podman run --rm \
            -e GITHUB_REPOSITORY_OWNER \
            -e GITHUB_REPOSITORY \
            -v "${{ github.workspace }}":/workspace:z \
            "${IMAGE_NAME}" \
            /workspace/.github/scripts/build_appimage.sh ${{ matrix.appimage_variant }}

      - name: Build Flatpak
        if: matrix.build_type == 'flatpak'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream
          chmod +x .github/scripts/build_flatpak.sh
          ./.github/scripts/build_flatpak.sh ${{ matrix.platform }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.version }}
          name: "PicoForge-All-v${{ env.version }}"
          body_path: .github/RELEASE_NOTES.md
          prerelease: false
          files: |
            target/release/pico-forge-all-*-windows-*.zip
            target/release/pico-forge-all-*-windows-*-setup.exe
            *.flatpak
            target/release/*.appimage
            target/release/*.AppImage
            target/release/*.zsync
            target/release/*.dmg
            target/release/*.app
            target/x86_64-apple-darwin/release/*.dmg
            target/aarch64-apple-darwin/release/*.dmg
            target/x86_64-apple-darwin/release/*.app
            target/aarch64-apple-darwin/release/*.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-spec:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync Spec Version & Tag
        run: |
          chmod +x .github/scripts/sync_spec_version.sh
          podman run --rm \
            --security-opt label=disable \
            -v "$PWD":/workspace \
            -w /workspace \
            -e GITHUB_TOKEN=$GITHUB_TOKEN \
            -e GITHUB_REPOSITORY=$GITHUB_REPOSITORY \
            fedora:latest \
            /workspace/.github/scripts/sync_spec_version.sh
